<h1 class="text-xl font-black text-slate-800 mb-4">Registrar oficio</h1>
<form method="post" class="max-w-2xl space-y-4 rounded-2xl border border-gray-200 bg-white p-5">
    {% csrf_token %}
    {% for campo in form %}
    <div>
        <label for="{{ campo.id_for_label }}" class="block text-xs font-bold uppercase text-slate-500 mb-1">{{ campo.label }}</label>
        {{ campo }}
        {% for e in campo.errors %}<p class="text-xs text-red-600 mt-1">{{ e }}</p>{% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="rounded-xl bg-brand-primary px-4 py-2 text-sm font-bold text-white">Guardar</button>
</form>
