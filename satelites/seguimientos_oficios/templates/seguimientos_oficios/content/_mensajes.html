{% for m in messages %}<div class="rounded-xl border px-4 py-2 text-sm {% if m.tags == 'error' %}border-red-200 bg-red-50 text-red-700{% elif m.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800{% else %}border-emerald-200 bg-emerald-50 text-emerald-700{% endif %}">{{ m }}</div>{% endfor %}
