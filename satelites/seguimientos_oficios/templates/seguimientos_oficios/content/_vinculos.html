{% if vinculos %}
<section class="overflow-hidden rounded-2xl border border-gray-200/80 bg-white p-5 shadow-sm">
    <header class="-mx-5 -mt-5 mb-4 flex items-center gap-3 border-b border-indigo-100 bg-indigo-50/70 px-5 py-3"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-indigo-600 text-white"><i data-lucide="link" class="h-4 w-4"></i></span><h2 class="text-xs font-black uppercase tracking-widest text-gray-800">Relacionado ({{ vinculos|length }})</h2></header>
    <ul class="divide-y divide-gray-100 text-xs">{% for v in vinculos %}
        <li class="flex flex-wrap items-center justify-between gap-2 py-2"><span><span class="text-gray-400">{{ v.relacion }}:</span> <b class="text-gray-800">{{ v.etiqueta }}</b>{% if v.estado %} <span class="rounded-lg border border-gray-200 px-2 py-0.5 text-[12px] font-black uppercase tracking-wider text-gray-600">{{ v.estado }}</span>{% endif %}</span>{% if v.url %}<a href="{{ v.url }}" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-black uppercase tracking-wider text-brand-accent">Abrir</a>{% endif %}</li>
    {% endfor %}</ul>
</section>
{% endif %}
