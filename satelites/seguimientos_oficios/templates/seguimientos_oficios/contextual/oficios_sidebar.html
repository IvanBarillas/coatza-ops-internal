<div class="flex h-full w-full flex-col bg-brand-primary font-mono text-white select-none">
    <div class="border-b border-white/10 p-5">
        <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-white/10 text-white">
                <i data-lucide="{{ area_actual.icon|default:'file-text' }}" class="h-5 w-5"></i>
            </div>
            <div class="min-w-0">
                <div class="text-xs font-black uppercase tracking-[0.22em] text-white/60">Seguimiento de oficios</div>
                <h2 class="truncate text-sm font-black uppercase tracking-tight text-white">{{ area_actual.nombre|default:"Seguimiento" }}</h2>
            </div>
        </div>
        {% if sidebar_areas %}{% url 'seguimientos_oficios:inicio' as inicio_url %}
        <a href="{{ inicio_url }}" hx-get="{{ inicio_url }}" hx-target="#workbench" hx-swap="innerHTML" hx-push-url="true"
           class="mt-4 flex items-center gap-1.5 rounded-lg bg-black/20 px-3 py-2 text-xs font-black uppercase tracking-widest text-white/70 transition-colors hover:bg-white/10 hover:text-white">
            <i data-lucide="layout-grid" class="h-3.5 w-3.5"></i>Inicio
        </a>
        {% endif %}
    </div>
    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
        {% for item in sidebar_items %}
            <a href="{{ item.href }}" hx-get="{{ item.href }}" hx-target="#page-content" hx-swap="innerHTML" hx-push-url="true"
               {% if item.active %}aria-current="page"{% endif %}
               class="flex min-h-11 items-center gap-2 rounded-xl border-l-4 px-3 py-2.5 text-xs font-black uppercase tracking-widest transition-colors {% if item.active %}border-brand-accent bg-white/15 text-white{% else %}border-transparent text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                <i data-lucide="{{ item.icon }}" class="h-4 w-4 shrink-0"></i><span class="truncate">{{ item.name }}</span>
            </a>
        {% endfor %}
    </nav>
</div>
