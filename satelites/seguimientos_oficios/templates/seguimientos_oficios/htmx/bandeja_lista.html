<div class="mt-3 rounded-xl border border-gray-200 bg-gray-50 p-3">
    {% if error %}
        <p class="text-xs text-red-600">{{ error }}</p>
    {% else %}
        <ul class="divide-y divide-gray-200 text-xs">
            {% for a in archivos %}
            <li class="flex flex-wrap items-center justify-between gap-2 py-2">
                <div><span class="font-bold text-gray-700">{{ a.nombre }}</span>
                    <span class="ml-2 text-xs text-gray-400">{{ a.tamano|filesizeformat }} · {{ a.modificado|date:"d/m/Y H:i" }}</span></div>
                <form method="post" action="{% url 'seguimientos_oficios:documento_adjuntar_bandeja' documento.pk %}">
                    {% csrf_token %}<input type="hidden" name="nombre" value="{{ a.nombre }}"><input type="hidden" name="rol" value="{{ rol }}">
                    <button type="submit" class="rounded-xl bg-brand-primary px-5 py-2.5 text-xs font-black uppercase tracking-widest text-white shadow-sm transition hover:brightness-110">Adjuntar</button>
                </form>
            </li>
            {% empty %}<li class="py-2 text-gray-500">No hay PDF en la bandeja.</li>{% endfor %}
        </ul>
    {% endif %}
</div>
