{# templates/navigation/module_group.html #}
{# static_group: encabezado fijo, sin acordeón (hoja de módulos móvil, con los grupos ya desplegados). #}
{% if static_group %}
<div class="flex w-full items-center gap-2.5 px-3 py-2 text-xs font-black uppercase tracking-widest text-white/70">
    <i data-lucide="{{ icon|default:'circle' }}" class="w-4 h-4 text-white/50"></i>
    {{ title }}
</div>
{% else %}

<button type="button" @click="openMenu = openMenu === '{{ group_id }}' ? '' : '{{ group_id }}'" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-black uppercase tracking-widest text-white/70 hover:text-white hover:bg-white/10 transition-all cursor-pointer outline-none">
    <span class="flex items-center gap-2.5">
        <i data-lucide="{{ icon|default:'circle' }}" class="w-4 h-4 text-white/50"></i>
        {{ title }}
    </span>
    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-white/40 transition-transform duration-200" :class="openMenu === '{{ group_id }}' ? 'rotate-180 text-white/80' : ''"></i>
</button>
{% endif %}
