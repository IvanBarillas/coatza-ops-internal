{# templates/navigation/module_item.html #}

<a href="{{ href|default:'#' }}"
    {% if hx_target %}
        hx-get="{{ href }}"
        hx-target="{{ hx_target }}"
        hx-swap="{{ hx_swap|default:'innerHTML' }}"
    {% endif %}
    {% if hx_push_url %}
        hx-push-url="{{ hx_push_url }}"
    {% endif %}
    class="group flex min-h-11 items-center gap-2.5 rounded-xl border-l-4 px-3 py-2.5 text-xs font-black uppercase tracking-wider transition-colors {% if active %}border-brand-accent bg-white/15 text-white{% else %}border-transparent text-white/70 hover:bg-white/10 hover:text-white{% endif %}"
>
    <i data-lucide="{{ icon|default:'circle' }}"
       class="h-4 w-4 shrink-0 {% if active %}text-white{% else %}text-white/50 group-hover:text-white/80{% endif %}">
    </i>

    <span class="truncate">
        {{ title }}
    </span>
</a>
