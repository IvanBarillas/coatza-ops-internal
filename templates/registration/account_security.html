{% extends "registration/identity_base.html" %}
{% block content %}
<h1 class="text-xl font-bold">Seguridad de mi cuenta</h1>
<p class="text-sm break-all">{{ user.email }}</p>
<nav class="flex flex-col gap-4 text-sm">
    <a class="underline" href="{% url 'accounts:password_change' %}">Cambiar contraseña</a>
    <a class="underline" href="{% url 'accounts:mfa_replace' %}">Configurar o reemplazar autenticador</a>
    <a class="underline" href="{% url 'accounts:email_verify' %}">Correo: {% if user.is_email_verified %}verificado{% else %}pendiente de verificar{% endif %}</a>
    <a class="underline" href="{% url 'index_hub' %}">Volver al inicio</a>
</nav>
{% endblock %}
