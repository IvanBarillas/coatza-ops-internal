# Override de docker-compose.prod.yml para las apps internas (seguimientos_oficios).
#
#   deploy/oficios/build.sh
#   podman-compose -f docker-compose.prod.yml -f deploy/oficios/docker-compose.oficios.yml up -d
#
# Cambios respecto al compose base:
#   - web y worker usan la imagen con OCR (ver Containerfile) en vez de construir la del Dockerfile.
#   - el worker monta el mismo volumen de archivos que web: el OCR lee los PDF adjuntos de ahí.
# AXENTRA_EXTRA_APPS y el resto de secretos siguen viniendo de .env.prod.
services:
  web:
    image: localhost/axentra-ops-internal:latest
    pull_policy: never

  worker:
    image: localhost/axentra-ops-internal:latest
    pull_policy: never
    volumes:
      - media_data:/app/media
