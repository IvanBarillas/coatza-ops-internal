{% load axentra_ui %}

<aside class="flex h-full w-full flex-col bg-brand-primary text-white">
    <div class="border-b border-white/10 px-5 py-5">
        <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-white/10 text-white shadow-sm"><i data-lucide="settings" class="h-5 w-5"></i></div>
            <div class="min-w-0 ax-sb-hide">
                <p class="font-mono text-xs font-black uppercase tracking-[0.22em] text-white/60">Axentra Core</p>
                <h2 class="truncate font-mono text-sm font-black uppercase tracking-tight text-white">Configuración</h2>
            </div>
        </div>
        <p class="ax-sb-hide mt-3 font-mono text-xs font-bold uppercase leading-relaxed tracking-wide text-white/60">Identidad institucional, municipio activo y parámetros oficiales del sistema.</p>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-4 py-4 font-mono">
        {% url 'security:tenant_config' as tenant_config_url %}
        <a href="{{ tenant_config_url }}" hx-get="{{ tenant_config_url }}" hx-target="#page-content" hx-swap="innerHTML" hx-push-url="true" class="group flex min-h-11 items-center gap-3 rounded-xl border-l-4 px-3 py-3 text-xs font-black uppercase tracking-widest transition-colors {% if current_configuration_view == 'security:tenant_config' %}border-brand-accent bg-white/15 text-white{% else %}border-transparent text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
            <i data-lucide="landmark" class="h-4 w-4 {% if current_configuration_view == 'security:tenant_config' %}text-white{% else %}text-white/50 group-hover:text-white/80{% endif %}"></i>
            <span>Identidad Institucional</span>
        </a>
        {% url 'security:privacidad_cookies' as privacidad_cookies_url %}
        <a href="{{ privacidad_cookies_url }}" hx-get="{{ privacidad_cookies_url }}" hx-target="#page-content" hx-swap="innerHTML" hx-push-url="true" class="group flex min-h-11 items-center gap-3 rounded-xl border-l-4 px-3 py-3 text-xs font-black uppercase tracking-widest transition-colors {% if current_configuration_view == 'security:privacidad_cookies' %}border-brand-accent bg-white/15 text-white{% else %}border-transparent text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
            <i data-lucide="shield-check" class="h-4 w-4 {% if current_configuration_view == 'security:privacidad_cookies' %}text-white{% else %}text-white/50 group-hover:text-white/80{% endif %}"></i>
            <span>Privacidad y Cookies</span>
        </a>
    </nav>
</aside>

<script>if (typeof lucide !== "undefined") { lucide.createIcons(); }</script>
