<aside class="flex h-full w-full flex-col bg-brand-primary text-white">
    <div class="border-b border-white/10 p-5">
        <div class="flex items-start gap-3">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl border border-brand-accent/20 bg-brand-accent/20 text-white"><i data-lucide="building-2" class="h-5 w-5"></i></div>
            <div class="min-w-0 ax-sb-hide">
                <p class="font-mono text-xs font-black uppercase tracking-[0.18em] text-white/60">Expediente de Dependencia</p>
                <h2 class="mt-1 truncate text-sm font-black leading-tight text-white">{{ dependencia.nombre }}</h2>
                <p class="mt-1 truncate font-mono text-xs font-bold uppercase tracking-widest text-white/60">{{ dependencia.slug|default:"sin-slug" }}</p>
            </div>
        </div>

        <div class="ax-sb-hide mt-5 grid grid-cols-2 gap-2">
            <div class="rounded-2xl border border-white/10 bg-white/5 p-3">
                <p class="font-mono text-xs font-black uppercase tracking-widest text-white/60">Estado</p>
                <p class="mt-1 font-mono text-xs font-black uppercase {% if dependencia.is_active %}text-emerald-400{% else %}text-rose-400{% endif %}">{% if dependencia.is_active %}Activa{% else %}Inactiva{% endif %}</p>
            </div>
            <div class="rounded-2xl border border-white/10 bg-white/5 p-3">
                <p class="font-mono text-xs font-black uppercase tracking-widest text-white/60">Áreas</p>
                <p class="mt-1 font-mono text-xs font-black uppercase text-white">{{ total_areas|default:0 }}</p>
            </div>
        </div>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
        {% for item in detail_menu %}
            <a href="{{ item.href }}" hx-get="{{ item.href }}" hx-target="#page-content" hx-swap="innerHTML" hx-push-url="true" class="flex min-h-11 items-center gap-3 rounded-2xl border-l-4 px-4 py-3 transition-colors group {% if item.active %}border-brand-accent bg-white/15 text-white{% else %}border-transparent text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                <i data-lucide="{{ item.icon }}" class="h-4 w-4 shrink-0 {% if item.active %}text-white{% else %}text-white/50 group-hover:text-white/80{% endif %}"></i>
                <span class="truncate font-mono text-xs font-black uppercase tracking-widest">{{ item.title }}</span>
            </a>
        {% endfor %}
    </nav>

    <div class="border-t border-white/10 p-3">
        <a href="{% url 'organigrama:dependencia_list' %}" hx-get="{% url 'organigrama:dependencia_list' %}" hx-target="#workbench" hx-swap="innerHTML" hx-push-url="true" class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl border border-white/15 bg-white/5 px-4 py-3 font-mono text-xs font-black uppercase tracking-widest text-white/80 transition hover:bg-white/10 hover:text-white">
            <i data-lucide="arrow-left" class="h-4 w-4"></i>Volver a Dependencias
        </a>
    </div>
</aside>

<script>if (typeof lucide !== "undefined") { lucide.createIcons(); }</script>
